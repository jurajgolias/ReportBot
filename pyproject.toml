[project]
name = "reportbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juraj Goliaš", email = "jurajgolias0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
    "ruff>=0.16.1",
]

[project.scripts]
reportbot = "reportbot:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
